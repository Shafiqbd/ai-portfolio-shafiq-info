# Host nginx reverse proxy for apps/web (AlmaLinux 9).
#
# Install:
#   sudo cp deploy/nginx/shafiq.info.bd.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then let certbot add the TLS server block and the HTTP->HTTPS redirect:
#   sudo certbot --nginx -d shafiq.info.bd -d www.shafiq.info.bd
#
# Certbot EDITS this file in place. After it runs, this block keeps only the
# ACME challenge + redirect, and a new `listen 443 ssl` block holds the
# proxy config below. Don't re-copy this file over certbot's version.

server {
    listen 80;
    listen [::]:80;
    server_name shafiq.info.bd www.shafiq.info.bd;

    # Contact form posts and any future uploads.
    client_max_body_size 10M;

    # Next.js emits immutable, content-hashed asset filenames.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Required for Next's dev/HMR websocket and for streaming responses.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
