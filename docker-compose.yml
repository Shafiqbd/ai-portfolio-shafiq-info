# Local dev stack. postgres/redis back apps/api (Phase 9), which connects to
# both at boot and reports them via GET /health. apps/web doesn't need either
# yet — it still reads data/*.json directly. Run `pnpm --filter api dev`
# against these; web/api containers themselves are Phase 15
# (see docker-compose.prod.yml).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shafiq_info
      POSTGRES_PASSWORD: shafiq_info
      POSTGRES_DB: shafiq_info
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  # web:
  #   build: ./docker/web.Dockerfile   # Phase 15
  # api:
  #   build: ./docker/api.Dockerfile   # Phase 9 + Phase 15

volumes:
  postgres-data:
