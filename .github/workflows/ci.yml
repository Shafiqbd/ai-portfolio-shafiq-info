name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r --if-present test

      - name: Build
        run: pnpm --filter web build

  build-push:
    name: Build & push images
    # Gate: images are only built once lint/typecheck/test/build all pass, so
    # a broken commit never reaches the registry.
    needs: verify
    # Pull requests verify only — they must not publish images (a fork PR has
    # no write access to the registry anyway).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Auto-provisioned per run; no PAT to create or rotate. Scoped by
          # the `packages: write` permission above.
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name, which GHCR requires:
      # Shafiqbd/ai-portfolio-shafiq-info -> ghcr.io/shafiqbd/...
      #
      # `type=raw,value=${{ github.sha }}` emits the BARE 40-char commit sha.
      # Do not switch to `type=sha` — it prefixes tags with `sha-`, which
      # would not match a `WEB_IMAGE_TAG=${{ github.sha }}` style pin in
      # docker-compose.prod.yml.
      - name: Docker meta (web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          # NEXT_PUBLIC_* is inlined into the client bundle at BUILD time —
          # a runtime env var on the VPS would never reach the browser.
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://shafiq.info.bd
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker meta (api)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Published images
        run: |
          echo "### Published to GHCR" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta-web.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta-api.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

# NOTE: VPS/SSH deployment is intentionally NOT part of this workflow yet.
# Images are published to GHCR and deployed manually — see DEPLOYMENT.md
# ("Going live on AlmaLinux 9"). The previous SSH deploy job is in git
# history at 8b7ac1c if it's needed as a starting point later.
