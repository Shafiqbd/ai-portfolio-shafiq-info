packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@scarf/scarf': false
  # Next.js uses sharp for next/image optimization in standalone/production
  # mode (docker/web.Dockerfile) — without its native binary built, deployed
  # images silently fail to load. Safe: sharp's install script only
  # downloads a prebuilt libvips binary for the current platform.
  sharp: true
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@nestjs/cli@12.0.5'
  - '@nestjs/swagger@12.0.2'
